<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ICSAMY 2024</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2d6fff">

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <!-- Custom Css links list starts -->
    <link href="css/navigation.css" rel="stylesheet">
    <link href="css/section.css" rel="stylesheet">
    <link href="css/parttabel.css" rel="stylesheet">
    <!-- Custom Css links list ends -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/favicon.js"></script>
</head>
<body>
    <header id="header"></header>
    <div class="banner">
        <img style="margin-top: 6%;" src="Images/participantsBannner.png" alt="ICSAMY Site Banner" width="100%">
    </div>
    
    <div id="partList" class="section-container table-container">
        <h1 class="sectionHeading">Participants</h1>
        <h2 id="participantCount">Total Participants: 0</h2> <!-- Displaying total participants -->
        <input type="text" id="searchInput" placeholder="Check your name..." class="form-control mb-3" onkeyup="filterParticipants()">
        <div class="card-container">
            <!-- Data will be inserted here -->
        </div>
    </div>
    
    <script>
        let participantsData = []; // Initialize an empty array to hold participant data

        // Fetch participants from JSON
        fetch("Json/participants.json")
        .then(response => response.json())
        .then(data => {
            participantsData = data; // Store fetched data

            // Sort participants by last name and then by second name if last names are the same
            data.sort((a, b) => {
                const namePartsA = a.Name ? a.Name.split(" ") : [];
                const namePartsB = b.Name ? b.Name.split(" ") : [];

                const lastNameA = namePartsA[namePartsA.length - 1]?.toLowerCase() || "";
                const secondLastNameA = namePartsA[namePartsA.length - 2]?.toLowerCase() || "";

                const lastNameB = namePartsB[namePartsB.length - 1]?.toLowerCase() || "";
                const secondLastNameB = namePartsB[namePartsB.length - 2]?.toLowerCase() || "";

                const lastNameComparison = lastNameA.localeCompare(lastNameB);
                if (lastNameComparison !== 0) {
                    return lastNameComparison;
                }

                return secondLastNameA.localeCompare(secondLastNameB);
            });

            // Display the participants
            displayParticipants(data);

            // Display total number of participants
            document.getElementById("participantCount").innerText = `Total Participants: ${data.length}`;
        })
        .catch(error => console.error('Error loading JSON data:', error));

        // Function to display participants in the card layout
        function displayParticipants(participants) {
            const cardContainer = document.querySelector(".card-container");
            cardContainer.innerHTML = ''; // Clear existing cards

            participants.forEach(participant => {
                const card = document.createElement("div");
                card.classList.add("card");
                card.innerHTML = `
                    <h2>${participant.Name || "N/A"}, ${participant.Affiliation || "N/A"}, ${participant.Country || "N/A"}</h2>
                `;
                cardContainer.appendChild(card);
            });
        }

        // Function to filter participants based on search input
        function filterParticipants() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();

            const filteredParticipants = participantsData.filter(participant => {
                return participant.Name.toLowerCase().includes(filter);
            });

            // Display filtered participants
            displayParticipants(filteredParticipants);

            // Update the count based on filtered results
            document.getElementById("participantCount").innerText = `Total Participants: ${filteredParticipants.length}`;
        }
    </script>

    <footer id="footer"></footer><!-- Footer is generated by Js -->
    <script src="js/navigationbarGen.js"></script><!-- To generate navigation bar -->
    <script src="js/footerGen.js"></script><!-- To generate footer -->
</body>
</html>
